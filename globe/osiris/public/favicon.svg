<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#121220"/>
      <stop offset="100%" stop-color="#06060C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="196" fill="url(#glow)"/>

  <!-- Instrument rings -->
  <circle cx="256" cy="248" r="188" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.16"/>
  <circle cx="256" cy="248" r="174" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.09" stroke-dasharray="4 14"/>

  <!-- Globe and radar mark -->
  <g filter="url(#soft)">
    <circle cx="256" cy="248" r="138" fill="rgba(212,175,55,0.035)" stroke="url(#gold)" stroke-width="7"/>

    <!-- Radar sweep -->
    <path d="M256 248 L354 150 A138 138 0 0 0 256 110 Z" fill="#D4AF37" opacity="0.13"/>
    <path d="M256 248 L354 150" stroke="#F5D76E" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

    <!-- Meridians -->
    <ellipse cx="256" cy="248" rx="62" ry="138" fill="none" stroke="#D4AF37" stroke-width="3.5" opacity="0.5"/>
    <line x1="256" y1="110" x2="256" y2="386" stroke="#D4AF37" stroke-width="2" opacity="0.28"/>

    <!-- Parallels -->
    <line x1="137" y1="196" x2="375" y2="196" stroke="#D4AF37" stroke-width="3" opacity="0.45"/>
    <line x1="118" y1="248" x2="394" y2="248" stroke="#D4AF37" stroke-width="5" opacity="0.8"/>
    <line x1="137" y1="300" x2="375" y2="300" stroke="#D4AF37" stroke-width="3" opacity="0.45"/>
    <line x1="198" y1="160" x2="198" y2="336" stroke="#D4AF37" stroke-width="1.5" opacity="0.18"/>
    <line x1="314" y1="160" x2="314" y2="336" stroke="#D4AF37" stroke-width="1.5" opacity="0.18"/>

    <!-- Contact and blips -->
    <circle cx="256" cy="248" r="10" fill="#F5D76E"/>
    <circle cx="256" cy="248" r="19" fill="none" stroke="#F5D76E" stroke-width="2" opacity="0.45"/>
    <circle cx="354" cy="150" r="7" fill="#00E5FF"/>
    <circle cx="354" cy="150" r="14" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.45"/>
    <circle cx="189" cy="318" r="5" fill="#D4AF37"/>
  </g>

  <!-- Corner instrument accents -->
  <g stroke="#D4AF37" stroke-width="2" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M64 112V64h48"/>
    <path d="M448 64h-48v48"/>
    <path d="M400 448h48v-48"/>
    <path d="M112 400H64v48"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="14" fill="url(#gold)">GLOBE</text>
</svg>
